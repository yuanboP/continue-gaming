schema_version = "1.3"
artifacts = ["/app/output"]
[metadata]
description = "ASTER visual real-time benchmark"
canonical_artifact = "/app/output/session.json"
[agent]
timeout_sec = 1200.0
[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 1536
workdir = "/app"
[verifier]
timeout_sec = 180.0
environment_mode = "separate"
[verifier.environment]
build_timeout_sec = 900.0
cpus = 1
memory_mb = 512
workdir = "/app"
network_mode = "no-network"
